<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bốc thăm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3d3e;--bg2:#0a2c2d;--paper:#f3ead3;--ink:#1c2b2b;--seal:#d1382b;--gold:#e8b84a;--muted:#9cc3bd}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--paper);
 background:radial-gradient(circle at 50% 30%,var(--bg),var(--bg2));
 display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:420px;text-align:center}
h1{font-size:2rem;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 28px;font-size:.95rem}
input{width:100%;padding:15px 16px;border-radius:12px;border:2px solid transparent;font:inherit;font-size:1.05rem;
 background:var(--paper);color:var(--ink);text-align:center}
input:focus{outline:none;border-color:var(--gold)}
button{margin-top:14px;width:100%;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:1.05rem;
 background:var(--seal);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.err{color:#ffb3a8;min-height:1.4em;margin-top:12px;font-size:.95rem}
.left{color:var(--muted);font-size:.85rem;margin-top:22px}

/* Sân khấu bốc thăm */
#stage{display:none}
.slips{position:relative;height:170px;margin:0 auto 10px;width:260px}
.slip{position:absolute;left:50%;top:50%;width:70px;height:96px;margin:-48px 0 0 -35px;border-radius:6px;
 background:linear-gradient(135deg,var(--paper) 50%,#d9cba6 50%);box-shadow:0 6px 14px #0006;
 animation:shuffle 1.1s ease-in-out infinite}
.slip::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--seal)}
.slip:nth-child(1){--x:-90px;--r:-20deg}.slip:nth-child(2){--x:-45px;--r:-8deg;animation-delay:.12s}
.slip:nth-child(3){--x:0px;--r:4deg;animation-delay:.24s}.slip:nth-child(4){--x:45px;--r:12deg;animation-delay:.08s}
.slip:nth-child(5){--x:90px;--r:22deg;animation-delay:.2s}
@keyframes shuffle{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--x),-14px) rotate(var(--r))}}
.status{font-weight:600;margin:6px 0 0;min-height:1.5em}

/* Phong bì mở thăm */
#env{display:none;position:relative;width:260px;height:170px;margin:0 auto;perspective:700px}
#env.show{display:block}
.body{position:absolute;inset:50px 0 0;background:#c9b987;border-radius:0 0 10px 10px;box-shadow:0 14px 30px #0007;z-index:3;
 clip-path:polygon(0 0,50% 48%,100% 0,100% 100%,0 100%)}
.back{position:absolute;inset:50px 0 0;background:#a99865;border-radius:0 0 10px 10px;z-index:1}
.flap{position:absolute;left:0;right:0;top:50px;height:80px;background:#dccd9a;z-index:4;transform-origin:top;
 clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .8s ease-in-out,z-index 0s .4s}
.seal{position:absolute;left:50%;top:112px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--seal);z-index:5;
 box-shadow:0 2px 6px #0006;transition:opacity .3s}
.card{position:absolute;left:14px;right:14px;top:62px;height:96px;background:var(--paper);color:var(--ink);border-radius:6px;z-index:2;
 display:flex;align-items:center;justify-content:center;padding:10px;font-weight:800;font-size:1.3rem;line-height:1.25;
 transition:transform .9s cubic-bezier(.2,.9,.3,1.1) .6s;overflow:hidden}
#env.shake{animation:shake .5s ease-in-out 3}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#env.open .flap{transform:rotateX(180deg);z-index:1}
#env.open .seal{opacity:0}
#env.open .card{transform:translateY(-120px) scale(1.12);z-index:6;height:120px}
#env.open{margin-top:110px}
.card .label{display:block;font-size:.75rem;font-weight:600;color:#6b7a78;margin-bottom:4px}

#final{display:none;margin-top:26px}
#final.show{display:block;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#final h2{margin:0;font-size:1rem;color:var(--muted);font-weight:600}
#final .res{font-size:2.2rem;font-weight:800;color:var(--gold);margin:6px 0 16px;word-break:break-word}
button.ghost{background:transparent;border:2px solid var(--muted);color:var(--paper)}
/* Quản trị */
#admin{display:none;text-align:left}
#admin .row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
#admin .row input{text-align:left;padding:11px 12px;font-size:1rem}
#admin .row small{flex:0 0 auto;color:var(--muted);font-size:.75rem;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#admin .row small.used{color:var(--gold)}
#admin .x{margin:0;width:40px;flex:0 0 40px;padding:10px 0;background:#ffffff1a}
#admin textarea{width:100%;min-height:80px;border-radius:12px;border:2px solid transparent;padding:10px 12px;font:inherit;background:var(--paper);color:var(--ink)}
#admin h3{margin:20px 0 8px;font-size:1rem}
#list{max-height:46vh;overflow:auto;padding-right:2px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;width:auto;margin-top:18px;padding:6px;font-weight:400;font-size:.85rem}
.ok{color:#9ee0b0;min-height:1.4em;margin-top:10px}
@media (prefers-reduced-motion:reduce){.slip,#env.shake{animation:none}.card,.flap{transition-duration:.01s}}
</style>
</head>
<body>
<main>
  <h1>Bốc thăm</h1>
  <p class="sub" id="sub">Nhập tên của bạn rồi chọn một lá thăm.</p>

  <section id="form">
    <input id="name" type="text" placeholder="Tên của bạn" maxlength="60" autocomplete="off" aria-label="Tên của bạn">
    <button id="go">Bốc thăm</button>
    <div class="err" id="err" role="alert"></div>
    <div class="left" id="left"></div>
    <button class="link" id="adminLink">Quản trị lá thăm</button>
  </section>

  <section id="admin">
    <div id="login">
      <input id="pw" type="password" placeholder="Mật khẩu quản trị" autocomplete="off" aria-label="Mật khẩu quản trị">
      <button id="loginBtn">Đăng nhập</button>
    </div>
    <div id="panel" style="display:none">
      <h3>Danh sách lá thăm</h3>
      <div id="list"></div>
      <button class="ghost" id="addBtn">+ Thêm lá thăm</button>
      <h3>Thêm nhiều lá thăm (mỗi dòng một lá)</h3>
      <textarea id="bulk" placeholder="Giải Nhất&#10;Giải Nhì&#10;Chúc may mắn"></textarea>
      <button class="ghost" id="bulkBtn">Thêm vào danh sách</button>
      <button id="saveBtn">Lưu thay đổi</button>
      <button class="ghost" id="resetBtn">Xóa toàn bộ kết quả bốc</button>
    </div>
    <div class="err" id="aerr" role="alert"></div>
    <div class="ok" id="aok"></div>
    <button class="link" id="exitAdmin">Quay lại trang bốc thăm</button>
  </section>

  <section id="stage">
    <div class="slips" id="slips"><i class="slip"></i><i class="slip"></i><i class="slip"></i><i class="slip"></i><i class="slip"></i></div>
    <div id="env" aria-hidden="true">
      <div class="back"></div>
      <div class="card"><div><span class="label" id="who"></span><span id="res"></span></div></div>
      <div class="body"></div>
      <div class="flap"></div>
      <div class="seal"></div>
    </div>
    <p class="status" id="status">Đang xáo thăm…</p>
    <div id="final">
      <h2 id="fname"></h2>
      <div class="res" id="fres"></div>
      <button class="ghost" id="again">Người tiếp theo</button>
    </div>
  </section>
</main>

<script>
// ====== CẤU HÌNH ======
// Dán URL Web App của Google Apps Script vào đây (xem hướng dẫn).
// Để trống = chạy thử với dữ liệu mẫu ngay trên trình duyệt.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzypsHku4UvuyC7SjdycptTGoUidcfPje3HiwM31QOke3rkV4AW3M8LHG-HkJW9OASn/exec";
const MIN_SHUFFLE_MS = 3200; // thời gian xáo thăm tối thiểu

// ====== DỮ LIỆU MẪU (chỉ dùng khi SCRIPT_URL trống) ======
let demoItems = ["Giải Nhất","Giải Nhì","Giải Ba","Chúc may mắn","Chúc may mắn","Phần quà bất ngờ"].map(t => ({ text: t, by: "" }));
const demoNames = new Set();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);

async function api(action, params = {}) {
  if (!SCRIPT_URL) {
    await sleep(300);
    if (action === "status") return { ok: true, left: demoItems.filter(x => !x.by).length };
    const n = (params.name || "").trim();
    if (demoNames.has(n.toLowerCase())) return { ok: false, error: `Tên "${n}" đã bốc thăm rồi.` };
    const free = demoItems.filter(x => x.text && !x.by);
    if (!free.length) return { ok: false, error: "Đã hết thăm." };
    const pick = free[Math.floor(Math.random() * free.length)];
    pick.by = n;
    demoNames.add(n.toLowerCase());
    return { ok: true, name: n, result: pick.text, left: free.length - 1 };
  }
  const url = SCRIPT_URL + "?" + new URLSearchParams({ action, ...params });
  const r = await fetch(url);
  return r.json();
}

async function refreshLeft() {
  try {
    const s = await api("status");
    $("left").textContent = s.ok ? `Còn ${s.left} lá thăm` : "";
  } catch { $("left").textContent = ""; }
}

async function draw() {
  const name = $("name").value.trim();
  $("err").textContent = "";
  if (!name) { $("err").textContent = "Vui lòng nhập tên trước khi bốc thăm."; $("name").focus(); return; }

  $("go").disabled = true;
  $("form").style.display = "none";
  $("stage").style.display = "block";
  $("sub").textContent = "Kết quả sẽ hiện sau khi mở thăm.";
  $("slips").style.display = "block";
  $("env").className = "";
  $("final").className = "";
  $("status").textContent = "Đang xáo thăm…";

  let data;
  try {
    // Gọi server và chờ hiệu ứng xáo thăm chạy song song; kết quả chưa được hiện
    [data] = await Promise.all([api("draw", { name }), sleep(MIN_SHUFFLE_MS)]);
  } catch (e) {
    data = { ok: false, error: "Không kết nối được Google Sheet. Kiểm tra lại URL và quyền truy cập." };
  }

  if (!data.ok) { backToForm(data.error); return; }

  // Chọn thăm → phong bì xuất hiện
  $("slips").style.display = "none";
  $("who").textContent = name;
  $("res").textContent = data.result;
  $("env").className = "show";
  $("status").textContent = "Bạn đã chọn được một lá thăm…";
  await sleep(500);
  $("env").classList.add("shake");
  $("status").textContent = "Đang mở thăm…";
  await sleep(1600);
  $("env").classList.add("open");
  await sleep(1700);

  $("status").textContent = "";
  $("fname").textContent = name + " bốc được";
  $("fres").textContent = data.result;
  $("final").classList.add("show");
}

function backToForm(msg) {
  $("stage").style.display = "none";
  $("form").style.display = "block";
  $("sub").textContent = "Nhập tên của bạn rồi chọn một lá thăm.";
  $("go").disabled = false;
  $("err").textContent = msg || "";
  refreshLeft();
}

// ====== QUẢN TRỊ ======
let pw = "", items = [];
async function adm(action, extra = {}) {
  if (!SCRIPT_URL) { // chế độ thử: mật khẩu là "admin"
    await sleep(200);
    if (pw !== "admin") return { ok: false, error: "Sai mật khẩu (bản thử dùng: admin)." };
    if (action === "list") return { ok: true, items: demoItems.map(x => ({ ...x })) };
    if (action === "save") { demoItems = extra.items.map(x => ({ ...x })); return { ok: true, count: demoItems.length }; }
    if (action === "reset") { demoItems.forEach(x => x.by = ""); demoNames.clear(); return { ok: true }; }
  }
  const r = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action, password: pw, ...extra }) });
  return r.json();
}
function msg(err, ok) { $("aerr").textContent = err || ""; $("aok").textContent = ok || ""; }

function renderList() {
  const box = $("list"); box.innerHTML = "";
  items.forEach((it, i) => {
    const row = document.createElement("div"); row.className = "row";
    const inp = document.createElement("input");
    inp.value = it.text; inp.placeholder = "Nội dung lá thăm"; inp.setAttribute("aria-label", "Lá thăm " + (i + 1));
    inp.oninput = () => { it.text = inp.value; };
    const st = document.createElement("small");
    st.textContent = it.by ? "Đã bốc: " + it.by : "Chưa bốc"; st.className = it.by ? "used" : "";
    const del = document.createElement("button"); del.className = "x"; del.textContent = "✕"; del.setAttribute("aria-label", "Xóa lá thăm");
    del.onclick = () => {
      if (it.by && !confirm(it.by + " đã bốc lá này. Vẫn xóa?")) return;
      items.splice(i, 1); renderList();
    };
    row.append(inp, st, del); box.appendChild(row);
  });
}
function openAdmin() {
  $("form").style.display = "none"; $("admin").style.display = "block";
  $("sub").textContent = "Quản trị lá thăm"; msg("", "");
}
function closeAdmin() {
  $("admin").style.display = "none"; $("form").style.display = "block";
  $("sub").textContent = "Nhập tên của bạn rồi chọn một lá thăm.";
  $("login").style.display = "block"; $("panel").style.display = "none"; $("pw").value = ""; pw = "";
  refreshLeft();
}
async function login() {
  pw = $("pw").value; msg("", "");
  try {
    const d = await adm("list");
    if (!d.ok) return msg(d.error);
    items = d.items; renderList();
    $("login").style.display = "none"; $("panel").style.display = "block";
  } catch { msg("Không kết nối được Google Sheet."); }
}
$("adminLink").onclick = openAdmin;
$("exitAdmin").onclick = closeAdmin;
$("loginBtn").onclick = login;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("addBtn").onclick = () => { items.push({ text: "", by: "" }); renderList(); const l = $("list"); l.scrollTop = l.scrollHeight; l.querySelector(".row:last-child input").focus(); };
$("bulkBtn").onclick = () => {
  $("bulk").value.split("\n").map(s => s.trim()).filter(Boolean).forEach(t => items.push({ text: t, by: "" }));
  $("bulk").value = ""; renderList();
};
$("saveBtn").onclick = async () => {
  msg("", "Đang lưu…");
  try {
    const d = await adm("save", { items: items.filter(x => x.text.trim()) });
    if (!d.ok) return msg(d.error);
    items = items.filter(x => x.text.trim()); renderList(); msg("", "Đã lưu " + d.count + " lá thăm.");
  } catch { msg("Không lưu được. Kiểm tra lại kết nối."); }
};
$("resetBtn").onclick = async () => {
  if (!confirm("Xóa toàn bộ kết quả bốc? Mọi lá thăm sẽ được bốc lại từ đầu.")) return;
  try {
    const d = await adm("reset");
    if (!d.ok) return msg(d.error);
    items.forEach(x => x.by = ""); renderList(); msg("", "Đã xóa kết quả, các lá thăm có thể bốc lại.");
  } catch { msg("Không kết nối được Google Sheet."); }
};
if (location.hash === "#admin") openAdmin();

$("go").onclick = draw;
$("name").addEventListener("keydown", e => { if (e.key === "Enter") draw(); });
$("again").onclick = () => { $("name").value = ""; backToForm(""); $("name").focus(); };
refreshLeft();
</script>
</body>
</html>
